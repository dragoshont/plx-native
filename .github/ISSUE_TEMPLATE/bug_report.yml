name: Vemm Samsung client bug
description: Report a reproducible problem in this unofficial Plex-compatible Samsung Tizen client.
body:
  - type: input
    id: tv-model
    attributes:
      label: Samsung TV model
      description: Model and region suffix from Settings > Support > About This TV; do not include the serial number or DUID.
      placeholder: UE55MU6172
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Tizen version and firmware
      description: Report the actual current runtime, not just the model year; write unknown if unavailable.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version or source commit
      description: Use the Vemm version/source commit, or explicitly identify historical Plx 0.2.7.
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Tizen TV Builder
        - Tizen Studio CLI or Device Manager
        - Not installed (host/source issue)
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and result
      description: Steps, expected behavior and actual result. For playback, include container/codecs, direct/transcode mode and the displayed error, without titles, URLs or tokens.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Optional screenshot or minimal error excerpt. Crop account/library data; never attach raw inspector logs, certificates, private addresses or credentials.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed tokens, passwords, server addresses, DUIDs and personal media/account data.
          required: true
